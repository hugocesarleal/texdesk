[project]
name = "texdesk"
description = "Editor e compilador LaTeX que roda no seu computador, com interface no navegador."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hugo César Leal" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["flask==3.1.3", "werkzeug==3.1.9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/hugocesarleal/texdesk"
Issues = "https://github.com/hugocesarleal/texdesk/issues"
Changelog = "https://github.com/hugocesarleal/texdesk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3"]

[project.scripts]
texdesk = "texdesk.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "texdesk.__version__" }  # a versão fica só em texdesk/__init__.py

[tool.setuptools.packages.find]
include = ["texdesk*"]

# ---------------------------------------------------------------- ruff (linter e formatador)
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["static/vendor", "projects", "output", "tools"]

[tool.ruff.lint]
# E/W: estilo · F: erros (nomes não usados/indefinidos) · I: ordem dos imports
# B: armadilhas comuns · UP: sintaxe moderna para Python 3.10+
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["texdesk"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
