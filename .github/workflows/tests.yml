name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  estilo:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.3
      - name: Linter
        run: ruff check .
      - name: Formatação
        run: ruff format --check .

  testes:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Roda o instalador de verdade de cada sistema: baixa o Tectonic e o biber,
      # cria o ambiente Python e compila os modelos. Assim o CI testa a instalação,
      # não só o código.
      - name: Instalar (setup.sh)
        if: runner.os != 'Windows'
        run: PYTHON=python ./setup.sh

      - name: Instalar (setup.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1

      - name: Rodar os testes (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -m pip install --quiet -r requirements-dev.txt
          .venv/bin/python -m pytest tests -v -rs

      - name: Rodar os testes (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest tests -v -rs
