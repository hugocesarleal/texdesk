<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>TexDesk — Projetos</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/pdfjs-3.11.174/pdf.min.js"></script>

<body>
<header class="dash-top">
  <a class="logo" href="/"><img src="/static/logo.svg" alt="" width="32" height="32"><span class="wordmark">Tex<b>Desk</b></span></a>
</header>
<main class="dash">
  <div class="dash-head">
    <h1>Seus projetos</h1>
    <input type="text" class="dash-search" id="search" placeholder="Buscar projetos…">
    <button class="btn" id="drive"></button>
    <button class="btn" id="upload"></button>
    <button class="btn primary" id="new"></button>
    <input type="file" id="zipfile" accept=".zip" hidden>
  </div>
  <div id="list"></div>
</main>
<footer class="dash-foot">
  TexDesk · código aberto sob a licença MIT ·
  <a href="https://github.com/hugocesarleal/texdesk" target="_blank" rel="noopener">github.com/hugocesarleal/texdesk</a><br>
  © 2026 <a href="https://github.com/hugocesarleal" target="_blank" rel="noopener">Hugo César Leal</a>
</footer>
<script>
const $ = (s) => document.querySelector(s);
$("#new").innerHTML = icon("plus") + "Novo projeto";
$("#upload").innerHTML = icon("upload") + "Enviar .zip";
let projects = [];

async function load() {
  projects = await api("/api/projects");
  render();
  fillThumbnails();
}

function render() {
  const q = $("#search").value.toLowerCase();
  const items = projects.filter((p) => p.name.toLowerCase().includes(q));
  if (!items.length) {
    $("#list").innerHTML = `<div class="empty">${projects.length ? "Nenhum projeto encontrado." : "Você ainda não tem projetos. Crie um para começar."}</div>`;
    return;
  }
  $("#list").innerHTML = `<table class="proj-table"><thead><tr><th colspan="2">Nome</th><th class="when">Última modificação</th><th></th></tr></thead><tbody>
    ${items.map((p) => `<tr data-name="${esc(p.name)}">
      <td class="thumb"><a href="/project/${encodeURIComponent(p.name)}" tabindex="-1">${thumbHtml(p)}</a></td>
      <td class="name"><a href="/project/${encodeURIComponent(p.name)}">${esc(p.name)}</a> ${driveIcon(p.drive)}</td>
      <td class="when">${timeAgo(p.modified)}</td>
      <td class="acts">
        <button class="icon-btn" data-act="rename" title="Renomear">${icon("edit")}</button>
        <button class="icon-btn" data-act="clone" title="Duplicar">${icon("copy")}</button>
        <button class="icon-btn" data-act="zip" title="Baixar .zip">${icon("download")}</button>
        <button class="icon-btn" data-act="delete" title="Excluir">${icon("trash")}</button>
      </td></tr>`).join("")}</tbody></table>`;
}

pdfjsLib.GlobalWorkerOptions.workerSrc = "/static/vendor/pdfjs-3.11.174/pdf.worker.min.js";

function thumbHtml(p) {
  if (!p.thumb) return `<span class="thumb-empty">${icon("file")}</span>`;
  const wide = p.thumbW && p.thumbH && p.thumbW > p.thumbH;
  return `<img class="${wide ? "wide" : "tall"}" src="/api/projects/${encodeURIComponent(p.name)}/thumbnail?v=${p.thumb}" alt="" loading="lazy">`;
}

// miniatura de baixa resolução (versões antigas geravam 240 px): regera uma vez
const thumbOutdated = (x) => !x.thumb || x.thumb < x.pdf || (x.thumbW && Math.max(x.thumbW, x.thumbH) < THUMB_SIZE);

// ------------------------------------------------------------ prévia ampliada ao passar o mouse
const pop = document.createElement("div");
pop.className = "thumb-pop";
pop.hidden = true;
pop.innerHTML = "<img alt=''>";
document.body.appendChild(pop);

function showPop(img) {
  const wide = img.naturalWidth > img.naturalHeight;
  const ratio = img.naturalWidth / img.naturalHeight || 0.707;
  // em pé: até 380 px de altura; deitado: até 460 px de largura (sempre dentro da janela)
  let h = wide ? 460 / ratio : 380;
  h = Math.min(h, innerHeight - 24);
  let w = h * ratio;
  if (w > innerWidth - 24) { w = innerWidth - 24; h = w / ratio; }
  const r = img.getBoundingClientRect();
  let left = r.right + 14;
  if (left + w > innerWidth - 12) left = Math.max(12, r.left - 14 - w);  // sem espaço à direita: abre à esquerda
  const top = Math.min(Math.max(12, r.top + r.height / 2 - h / 2), innerHeight - h - 12);
  const pi = pop.querySelector("img");
  pi.src = img.src;
  // a prévia "cresce" a partir da miniatura: começa do tamanho dela, no lugar dela
  const originX = r.left + r.width / 2 - left, originY = r.top + r.height / 2 - top;
  clearTimeout(popHideTimer);
  Object.assign(pop.style, {
    width: w + "px", height: h + "px", left: left + "px", top: top + "px",
    transformOrigin: `${originX}px ${originY}px`, transition: "none",
    transform: `scale(${r.width / w})`, opacity: "0.4",
  });
  pop.hidden = false;
  void pop.offsetWidth;  // aplica o estado inicial antes de animar
  pop.style.transition = "";
  pop.style.transform = "scale(1)";
  pop.style.opacity = "1";
  popFrom = r.width / w;
}

let popHideTimer = 0, popFrom = 0.2;
function hidePop(animated = true) {
  if (pop.hidden) return;
  if (!animated) { pop.hidden = true; return; }
  pop.style.transform = `scale(${popFrom})`;  // encolhe de volta para a miniatura
  pop.style.opacity = "0";
  popHideTimer = setTimeout(() => { pop.hidden = true; }, 160);
}

$("#list").addEventListener("mouseover", (e) => {
  const img = e.target.closest("td.thumb img");
  if (img && img.complete && img.naturalWidth) showPop(img);
});
$("#list").addEventListener("mouseout", (e) => { if (e.target.closest("td.thumb img")) hidePop(); });
addEventListener("scroll", () => hidePop(false), { passive: true });

// Gera (uma vez) as miniaturas que faltam ou ficaram mais velhas que o PDF compilado.
let thumbQueueRunning = false;
async function fillThumbnails() {
  if (thumbQueueRunning) return;
  thumbQueueRunning = true;
  try {
    for (const p of projects.filter((x) => x.pdf && thumbOutdated(x))) {
      try {
        const size = await saveThumbnail(p.name, p.pdfUrl);
        p.thumb = Date.now() / 1000;
        p.thumbW = size.width;
        p.thumbH = size.height;
        const cell = document.querySelector(`tr[data-name="${CSS.escape(p.name)}"] td.thumb a`);
        if (cell) cell.innerHTML = thumbHtml(p);
      } catch (e) { p.thumb = p.pdf; /* PDF ilegível: não tenta de novo nesta visita */ }
    }
  } finally { thumbQueueRunning = false; }
}

function driveIcon(st) {
  const b = driveBadge(st);
  return b ? `<span class="drive-ind ${b.cls}" title="${esc(b.text)}">${icon(b.icon)}</span>` : "";
}

// ------------------------------------------------------------ painel do Google Drive
$("#drive").innerHTML = icon("cloud") + "Google Drive";
$("#drive").onclick = () => openDrivePanel();

async function openDrivePanel() {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal wide"><h2>Google Drive</h2><div id="drive-body">Carregando…</div>
    <div class="actions"><button class="btn" data-close>Fechar</button></div></div>`;
  const close = () => { clearTimeout(pollTimer); bg.remove(); load(); };
  bg.addEventListener("mousedown", (e) => { if (e.target === bg) close(); });
  bg.querySelector("[data-close]").onclick = close;
  document.body.appendChild(bg);
  const body = bg.querySelector("#drive-body");

  async function refresh() {
    let st;
    try { st = await api("/api/drive/status"); } catch (e) { body.innerHTML = `<div class="err-box">${esc(e.message)}</div>`; return; }

    if (!st.configured) {
      body.innerHTML = `
        <p class="note">Para acessar o Drive, o Google exige credenciais OAuth do seu próprio projeto no Google Cloud. É gratuito, não pede cartão e é feito uma vez só (uns 5 minutos). Abra cada link numa nova aba, com a mesma conta Google que vai usar o Drive.</p>
        <ol class="steps">
          <li><b>Criar o projeto.</b> Abra <a href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener">Novo projeto</a>, digite um nome (ex.: <code>TexDesk</code>), deixe "Local" como está e clique em <b>Criar</b>. Espere a notificação "Projeto criado" (sino no canto superior direito) e clique em <b>Selecionar projeto</b>.
            <br><small>Confira no topo da página, ao lado do logo "Google Cloud", que o seletor mostra <b>TexDesk</b>. Todos os passos abaixo valem para o projeto selecionado ali.</small></li>
          <li><b>Ativar a Google Drive API.</b> Abra a <a href="https://console.cloud.google.com/apis/library/drive.googleapis.com" target="_blank" rel="noopener">página da Google Drive API</a> e clique no botão azul <b>Ativar</b> (em inglês, <b>Enable</b>). Quando terminar, o botão vira <b>Gerenciar</b>: está ativada.
            <br><small>Não achou? Pelo menu ☰ (canto superior esquerdo), vá em <b>APIs e serviços → Biblioteca</b>, digite <code>Google Drive API</code> na busca e clique no resultado com o ícone do Drive. Se a página pedir para "Selecionar um projeto", escolha <b>TexDesk</b>. Cuidado para não escolher a "Google Drive Activity API" nem a "Drive Labels API".</small></li>
          <li><b>Configurar a tela de consentimento.</b> Abra o <a href="https://console.cloud.google.com/auth/overview" target="_blank" rel="noopener">Google Auth Platform</a> e clique em <b>Começar</b> (Get started):
            <br>• <b>Informações do app:</b> nome <code>TexDesk</code> e o seu e-mail como e-mail de suporte → <b>Próxima</b>.
            <br>• <b>Público-alvo:</b> escolha <b>Externo</b> → <b>Próxima</b>.
            <br>• <b>Dados de contato:</b> o seu e-mail → <b>Próxima</b>. Aceite a política e clique em <b>Criar</b>.</li>
          <li><b>Liberar a sua conta.</b> No menu da esquerda do Google Auth Platform, abra <a href="https://console.cloud.google.com/auth/audience" target="_blank" rel="noopener">Público-alvo</a>. Em <b>Usuários de teste</b>, clique em <b>+ Adicionar usuários</b>, digite o seu e-mail do Google e salve.
            <br><small>Sem isso, o login dá o erro "access_denied". Depois de conectar, recomendo clicar em <b>Publicar app</b> nessa mesma página: no modo "Em teste" o Google faz o acesso expirar a cada 7 dias. Publicar é gratuito e, como o app só usa <code>drive.file</code>, não exige verificação.</small></li>
          <li><b>Criar a credencial.</b> Abra <a href="https://console.cloud.google.com/auth/clients" target="_blank" rel="noopener">Clientes</a> → <b>+ Criar cliente</b>. Em <b>Tipo de aplicativo</b>, escolha <b>App para computador</b> (Desktop app), dê um nome qualquer e clique em <b>Criar</b>.</li>
          <li><b>Baixar o JSON.</b> Na janela "Cliente OAuth criado", clique em <b>Fazer o download do JSON</b>. Se a janela já fechou, clique no nome do cliente na lista e use o ícone de download em <b>Chaves secretas do cliente</b>. O arquivo se chama algo como <code>client_secret_….apps.googleusercontent.com.json</code>.</li>
          <li><b>Enviar aqui:</b></li>
        </ol>
        <p><input type="file" id="cred-file" accept=".json,application/json"></p>
        <p class="note">O app pede apenas o escopo <code>drive.file</code>: ele só enxerga os arquivos que ele mesmo criar, nunca o resto do seu Drive.</p>`;
      body.querySelector("#cred-file").onchange = async (e) => {
        const fd = new FormData();
        fd.append("file", e.target.files[0]);
        try { await api("/api/drive/credentials", { method: "POST", body: fd }); refresh(); } catch (err) { toast(err.message, 5000); }
      };
      return;
    }

    if (!st.connected) {
      body.innerHTML = `
        <p>Credenciais configuradas. Agora conecte sua conta Google:</p>
        <p><a class="btn primary" href="/api/drive/connect">${icon("cloud")} Conectar ao Google Drive</a></p>
        <p class="note">Você será levado à tela de login do Google e voltará para cá. Como o app está em modo de teste, o Google mostra um aviso de "app não verificado": clique em <b>Continuar</b>.</p>
        <p class="note">Trocar credenciais: <input type="file" id="cred-file" accept=".json"></p>`;
      body.querySelector("#cred-file").onchange = async (e) => {
        const fd = new FormData();
        fd.append("file", e.target.files[0]);
        try { await api("/api/drive/credentials", { method: "POST", body: fd }); toast("Credenciais atualizadas"); } catch (err) { toast(err.message, 5000); }
      };
      return;
    }

    renderConnected(st);
  }

  // ---- painel conectado: conta, opção global, progresso e lista de projetos
  let tab = "local";
  let remoteCache = null;

  function renderConnected(st) {
    const u = st.user || {};
    const initial = (u.displayName || u.emailAddress || "?").trim()[0].toUpperCase();
    body.innerHTML = `
      <div class="dp-account">
        <div class="dp-avatar">${esc(initial)}</div>
        <div class="who"><b>${esc(u.displayName || "Conta Google")}</b><small>${esc(u.emailAddress || "")}</small></div>
        <a class="btn small" id="dp-open" target="_blank" rel="noopener" hidden>${icon("folderOpen")}Abrir no Drive</a>
        <button class="btn small danger" id="drive-disconnect">Desconectar</button>
      </div>

      <label class="dp-toggle">
        <span class="txt"><b>Sincronizar todos os projetos</b>
          <small>Inclui os projetos criados daqui em diante. Para ligar ou desligar um projeto só, use as Configurações dentro do editor.</small></span>
        <input type="checkbox" id="sync-all" ${st.syncAll ? "checked" : ""}><span class="track" aria-hidden="true"></span>
      </label>

      <div class="dp-progress" id="dp-progress"></div>

      <div class="dp-head">
        <div class="dp-tabs" role="tablist">
          <button role="tab" data-tab="local">Neste computador <span id="dp-n-local"></span></button>
          <button role="tab" data-tab="remote">Só no Drive <span id="dp-n-remote"></span></button>
        </div>
        <button class="btn small" id="dp-sync-now" title="Verifica todos os projetos e envia o que mudou">${icon("refresh")}Sincronizar agora</button>
      </div>
      <div class="dp-list" id="dp-list"><div class="dp-empty">Carregando…</div></div>

      <p class="note">Os projetos ficam na pasta <b>TexDesk</b> do seu Drive. Enquanto você edita, as alterações são enviadas a cada 5 segundos. Arquivos apagados aqui vão para a lixeira do Drive. Excluir um projeto aqui não o apaga do Drive.</p>`;

    body.querySelector("#drive-disconnect").onclick = async () => {
      const ok = await modal({ title: "Desconectar o Google Drive?", body: "<p>A sincronização para. Nada é apagado do Drive nem do computador.</p>", ok: "Desconectar", danger: true });
      if (ok) { await api("/api/drive/disconnect", { method: "POST" }); refresh(); }
    };
    body.querySelector("#sync-all").onchange = async (e) => {
      await api("/api/drive/sync-all", { json: { enabled: e.target.checked } });
      toast(e.target.checked ? "Sincronização ligada para todos os projetos" : "Sincronização desligada para todos os projetos");
      poll();
    };
    body.querySelector("#dp-sync-now").onclick = async () => { await api("/api/drive/sync-now", { method: "POST" }); poll(); };
    body.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; drawList(); if (tab === "remote") loadRemote(); }));
    body.querySelector("#dp-list").onclick = onListClick;
    poll();
    loadRemote();
  }

  let ov = null;
  let pollTimer = null;
  async function poll() {
    clearTimeout(pollTimer);
    if (!bg.isConnected) return;
    try { ov = await api("/api/drive/overview"); } catch (e) { ov = { error: e.message, counts: {}, projects: [] }; }
    drawProgress();
    drawList();
    const busy = ov.counts && ov.counts.pending > 0;
    pollTimer = setTimeout(poll, busy ? 1500 : 5000);
  }

  function drawProgress() {
    const el = body.querySelector("#dp-progress");
    if (!el || !ov) return;
    const c = ov.counts || {};
    const open = body.querySelector("#dp-open");
    if (open && ov.rootId) { open.href = `https://drive.google.com/drive/folders/${ov.rootId}`; open.hidden = false; }
    if (ov.error) { el.className = "dp-progress err"; el.innerHTML = `${icon("cloudOff")}<div><b>Não foi possível consultar o Drive</b><small>${esc(ov.error)}</small></div>`; return; }
    if (!c.total) {
      el.className = "dp-progress idle";
      el.innerHTML = `${icon("cloudOff")}<div><b>Nenhum projeto sincronizado</b><small>Ligue a opção acima ou ative projetos nas configurações do editor.</small></div>`;
      return;
    }
    const pct = Math.round((c.synced / c.total) * 100);
    const last = Math.max(0, ...ov.projects.map((p) => p.lastSync || 0));
    let cls, ic, title, sub;
    if (c.error) {
      cls = "err"; ic = "cloudOff";
      title = `${c.error} projeto${c.error > 1 ? "s" : ""} com erro`;
      sub = "Será tentado de novo automaticamente. Veja os detalhes na lista abaixo.";
    } else if (c.pending) {
      cls = "busy"; ic = "cloudUp";
      title = `Enviando para o Drive… ${c.synced} de ${c.total}`;
      sub = "Pode continuar usando normalmente. O projeto que você estiver editando tem prioridade.";
    } else {
      cls = "ok"; ic = "cloudCheck";
      title = `Tudo salvo no Drive · ${c.total} projeto${c.total > 1 ? "s" : ""}`;
      sub = last ? `Última sincronização ${timeAgo(last)}` : "";
    }
    el.className = `dp-progress ${cls}`;
    el.innerHTML = `${icon(ic)}<div class="grow"><b>${esc(title)}</b><small>${esc(sub)}</small>
      <div class="bar"><span style="width:${pct}%"></span></div></div>`;
  }

  function projState(p) {
    if (p.state === "error") return { o: 0, cls: "drive-err", ic: "cloudOff", txt: p.error || "Erro" };
    if (p.state === "syncing") return { o: 1, cls: "drive-busy", ic: "cloudUp", txt: "Enviando…" };
    if (p.pending || !p.lastSync) return { o: 2, cls: "drive-off", ic: "cloud", txt: "Na fila" };
    return { o: 3, cls: "drive-ok", ic: "cloudCheck", txt: "Salvo " + timeAgo(p.lastSync) };
  }

  function drawList() {
    const el = body.querySelector("#dp-list");
    if (!el) return;
    body.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
    const nl = body.querySelector("#dp-n-local"), nr = body.querySelector("#dp-n-remote");
    if (nl && ov) nl.textContent = ov.projects ? ov.projects.length : "";
    const onlyRemote = (remoteCache || []).filter((r) => !r.local);
    if (nr) nr.textContent = remoteCache ? onlyRemote.length : "";

    if (tab === "local") {
      if (!ov) return;
      if (!ov.projects.length) { el.innerHTML = `<div class="dp-empty">Nenhum projeto com sincronização ligada.</div>`; return; }
      const rows = ov.projects.map((p) => ({ p, s: projState(p) })).sort((a, b) => a.s.o - b.s.o || a.p.name.localeCompare(b.p.name));
      el.innerHTML = rows.map(({ p, s }) => `<div class="dp-row">
          <span class="drive-ind ${s.cls}">${icon(s.ic)}</span>
          <a class="nm" href="/project/${encodeURIComponent(p.name)}">${esc(p.name)}</a>
          <span class="st ${s.cls}" title="${esc(s.txt)}">${esc(s.txt)}</span>
        </div>`).join("");
    } else {
      if (!remoteCache) { el.innerHTML = `<div class="dp-empty">Carregando…</div>`; return; }
      el.innerHTML = onlyRemote.length ? onlyRemote.map((r) => `<div class="dp-row">
          <span class="drive-ind drive-off">${icon("folder")}</span>
          <span class="nm">${esc(r.name)}</span>
          <button class="btn small" data-restore="${esc(r.id)}" data-name="${esc(r.name)}">${icon("download")}Baixar</button>
        </div>`).join("") : `<div class="dp-empty">Todos os projetos do Drive já estão neste computador.<br><small>Esta lista serve para baixar projetos em outro computador ou recuperar um projeto excluído aqui.</small></div>`;
    }
  }

  async function loadRemote() {
    try { remoteCache = await api("/api/drive/remote"); } catch (e) { remoteCache = []; toast(e.message, 5000); }
    drawList();
  }

  async function onListClick(e) {
    const b = e.target.closest("[data-restore]");
    if (!b) return;
    const r = await modal({ title: "Baixar projeto do Drive", fields: [{ name: "name", label: "Nome do projeto local", value: b.dataset.name }], ok: "Baixar" });
    if (!r) return;
    b.disabled = true;
    b.textContent = "Baixando…";
    try {
      const res = await api("/api/drive/restore", { json: { id: b.dataset.restore, name: r.name, remoteName: b.dataset.name } });
      toast(`${res.name}: ${res.files} arquivo(s) baixado(s)`);
      await loadRemote();
      poll();
    } catch (err) { toast(err.message, 5000); b.disabled = false; b.textContent = "Baixar"; }
  }

  refresh();
}

// ------------------------------------------------------------ importar projetos que já estão no Drive
// Ao conectar (ou abrir o painel já conectado), se o Drive tiver projetos do TexDesk que não
// existem neste computador, pergunta se o usuário quer importá-los. Os importados ficam com a
// sincronização ligada. A resposta é lembrada: os recusados não são oferecidos de novo
// (continuam na aba "Só no Drive" do painel do Google Drive).
let importPromptShown = false;

async function offerDriveImport() {
  if (importPromptShown) return;
  let cands;
  try { cands = await api("/api/drive/import-candidates"); } catch (e) { return; }
  if (!cands.length || importPromptShown) return;
  importPromptShown = true;

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal wide">
      <h2>Projetos encontrados no seu Google Drive</h2>
      <p class="note" style="font-size:13.5px">Seu Drive tem ${cands.length === 1 ? "1 projeto" : cands.length + " projetos"} do TexDesk que não ${cands.length === 1 ? "está" : "estão"} neste computador. Quer importar? Os projetos importados continuam sincronizados com o Drive: o que você alterar aqui é salvo lá.</p>
      <div class="imp-head"><label class="imp-all"><input type="checkbox" checked> Selecionar todos</label></div>
      <div class="dp-list imp-list">${cands.map((c) => `<label class="dp-row imp-row">
          <input type="checkbox" value="${esc(c.id)}" data-name="${esc(c.name)}" checked>
          <span class="drive-ind drive-ok">${icon("folder")}</span>
          <span class="nm">${esc(c.name)}</span>
          <span class="st drive-off">${c.modified ? "alterado " + timeAgo(Date.parse(c.modified) / 1000) : ""}</span>
        </label>`).join("")}</div>
      <div id="imp-progress" hidden></div>
      <div class="actions"><button class="btn" data-later>Agora não</button>
        <button class="btn primary" data-import>Importar</button></div>
    </div>`;
  document.body.appendChild(bg);
  const boxes = [...bg.querySelectorAll(".imp-list input")];
  const all = bg.querySelector(".imp-all input");
  const btn = bg.querySelector("[data-import]");
  const refreshCount = () => {
    const n = boxes.filter((b) => b.checked).length;
    btn.textContent = n ? `Importar ${n === 1 ? "1 projeto" : n + " projetos"}` : "Importar";
    btn.disabled = !n;
    all.checked = n === boxes.length;
    all.indeterminate = n > 0 && n < boxes.length;
  };
  boxes.forEach((b) => (b.onchange = refreshCount));
  all.onchange = () => { boxes.forEach((b) => (b.checked = all.checked)); refreshCount(); };
  refreshCount();

  const markOffered = () => api("/api/drive/offered", { json: { ids: cands.map((c) => c.id) } }).catch(() => {});
  bg.querySelector("[data-later]").onclick = async () => {
    await markOffered();
    bg.remove();
    toast("Tudo bem. Os projetos continuam no Drive: use Google Drive → Só no Drive para baixar depois.", 6000);
  };

  btn.onclick = async () => {
    const chosen = boxes.filter((b) => b.checked).map((b) => ({ id: b.value, name: b.dataset.name }));
    bg.querySelector(".imp-head").hidden = true;
    bg.querySelector(".imp-list").hidden = true;
    bg.querySelector(".actions").hidden = true;
    const prog = bg.querySelector("#imp-progress");
    prog.hidden = false;
    const done = [], failed = [];
    for (const [i, c] of chosen.entries()) {
      prog.innerHTML = `<div class="dp-progress busy">${icon("cloudUp")}<div class="grow">
          <b>Importando ${i + 1} de ${chosen.length}: ${esc(c.name)}</b>
          <small>Baixando os arquivos do Drive…</small>
          <div class="bar"><span style="width:${Math.round((i / chosen.length) * 100)}%"></span></div></div></div>`;
      try {
        const r = await api("/api/drive/import", { json: c });
        done.push(r);
      } catch (e) { failed.push({ name: c.name, error: e.message }); }
    }
    await markOffered();
    prog.innerHTML = `<div class="dp-progress ${failed.length ? "err" : "ok"}">${icon(failed.length ? "cloudOff" : "cloudCheck")}<div class="grow">
        <b>${done.length} ${done.length === 1 ? "projeto importado" : "projetos importados"}${failed.length ? `, ${failed.length} com erro` : ""}</b>
        <small>${done.length ? "Eles já aparecem na sua lista e continuam sincronizados com o Drive." : ""}</small></div></div>
      ${failed.map((f) => `<div class="err-box" style="margin-top:8px">${esc(f.name)}: ${esc(f.error)}</div>`).join("")}
      ${done.some((d) => !chosen.find((c) => c.name === d.name)) ? `<p class="note" style="margin-top:8px">Alguns nomes foram ajustados porque já existia um projeto com o mesmo nome neste computador.</p>` : ""}
      <div class="actions" style="margin-top:12px"><button class="btn primary" data-close>Fechar</button></div>`;
    prog.querySelector("[data-close]").onclick = () => bg.remove();
    load();
  };
}

// volta do login do Google
(function () {
  const q = new URLSearchParams(location.search).get("drive");
  if (!q) return;
  history.replaceState(null, "", "/");
  if (q === "ok") toast("Google Drive conectado!");
  else toast(q, 6000);
  openDrivePanel();
})();
offerDriveImport();

// atualiza os ícones de sincronização enquanto há envio pendente
setInterval(async () => {
  if (!projects.some((p) => p.drive && (p.drive.pending || p.drive.state === "syncing"))) return;
  const fresh = await api("/api/projects").catch(() => null);
  if (!fresh) return;
  for (const f of fresh) {
    const p = projects.find((x) => x.name === f.name);
    if (!p) continue;
    p.drive = f.drive;
    const cell = document.querySelector(`tr[data-name="${CSS.escape(p.name)}"] td.name`);
    if (cell) { cell.querySelector(".drive-ind")?.remove(); cell.insertAdjacentHTML("beforeend", driveIcon(p.drive)); }
  }
}, 3000);

$("#search").oninput = render;

$("#list").onclick = async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const name = b.closest("tr").dataset.name;
  const enc = encodeURIComponent(name);
  try {
    if (b.dataset.act === "zip") location.href = `/api/projects/${enc}/zip`;
    if (b.dataset.act === "rename") {
      const r = await modal({ title: "Renomear projeto", fields: [{ name: "name", label: "Novo nome", value: name }], ok: "Renomear" });
      if (r) { await api(`/api/projects/${enc}/rename`, { json: r }); load(); }
    }
    if (b.dataset.act === "clone") {
      const r = await modal({ title: "Duplicar projeto", fields: [{ name: "name", label: "Nome da cópia", value: name + " (cópia)" }], ok: "Duplicar" });
      if (r) { await api(`/api/projects/${enc}/clone`, { json: r }); load(); }
    }
    if (b.dataset.act === "delete") {
      const r = await modal({ title: "Excluir projeto", body: `<p>Excluir <b>${esc(name)}</b> e todos os seus arquivos? Isso não pode ser desfeito.</p>`, ok: "Excluir", danger: true });
      if (r) { await api(`/api/projects/${enc}`, { method: "DELETE" }); load(); }
    }
  } catch (err) { toast(err.message); }
};

// ------------------------------------------------------------ novo projeto (nome + escolha do modelo)
const TEMPLATE_ICONS = { blank: "file", "ifmg-slides": "slides", "ifmg-artigo": "fileText" };

$("#new").onclick = async () => {
  let tpls;
  try { tpls = await api("/api/templates"); } catch (e) { toast(e.message); return; }
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<form class="modal wide" novalidate>
      <h2>Novo projeto</h2>
      <label>Nome do projeto<input type="text" name="name" autocomplete="off" placeholder="Ex.: Trabalho de Redes"></label>
      <div class="field-error" id="np-err" hidden></div>
      <div class="tpl-label">Modelo</div>
      <div class="tpl-grid" role="radiogroup">
        ${tpls.map((t, i) => `<label class="tpl-card">
            <input type="radio" name="template" value="${esc(t.id)}" ${i === 0 ? "checked" : ""}>
            <span class="tpl-ic">${icon(TEMPLATE_ICONS[t.id] || "file")}</span>
            <b>${esc(t.name)}</b><small>${esc(t.description)}</small>
            ${t.source ? `<a class="tpl-src" href="${esc(t.source)}" target="_blank" rel="noopener" title="Repositório original do modelo">${icon("external")}${esc(t.source.replace("https://github.com/", ""))}</a>` : ""}
          </label>`).join("")}
      </div>
      <div class="actions"><button type="button" class="btn" data-cancel>Cancelar</button>
        <button type="submit" class="btn primary">Criar projeto</button></div>
    </form>`;
  const form = bg.querySelector("form");
  const nameEl = form.elements.name;
  const err = form.querySelector("#np-err");
  const close = () => bg.remove();
  bg.addEventListener("mousedown", (e) => { if (e.target === bg) close(); });
  form.querySelector("[data-cancel]").onclick = close;
  form.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  nameEl.oninput = () => { err.hidden = true; };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const name = nameEl.value.trim();
    if (!name) { err.textContent = "Digite um nome para o projeto."; err.hidden = false; nameEl.focus(); return; }
    const btn = form.querySelector("[type=submit]");
    btn.disabled = true;
    try {
      const p = await api("/api/projects", { json: { name, template: form.elements.template.value } });
      location.href = `/project/${encodeURIComponent(p.name)}`;
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false; btn.disabled = false;
    }
  };
  document.body.appendChild(bg);
  nameEl.focus();
};

$("#upload").onclick = () => $("#zipfile").click();
$("#zipfile").onchange = async () => {
  const f = $("#zipfile").files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append("file", f);
  try {
    const p = await api("/api/projects/upload", { method: "POST", body: fd });
    location.href = `/project/${encodeURIComponent(p.name)}`;
  } catch (err) { toast(err.message); }
  $("#zipfile").value = "";
};

load();
</script>
